<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="greenSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="lushLawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#greenSky)"/>

  <!-- Distant Campus Building -->
  <rect x="520" y="420" width="880" height="240" fill="#cbd5e1" opacity="0.6"/>
  <polygon points="500,420 960,320 1420,420" fill="#94a3b8" opacity="0.6"/>

  <!-- Green Grass Horizon and Hills -->
  <path d="M 0 540 Q 400 480 800 520 T 1600 500 L 1920 520 L 1920 1080 L 0 1080 Z" fill="url(#lushLawn)"/>

  <!-- Campus Trees -->
  <g fill="#166534">
    <circle cx="280" cy="540" r="100"/>
    <circle cx="340" cy="480" r="120"/>
    <circle cx="420" cy="550" r="90"/>
    <rect x="330" y="560" width="30" height="120" fill="#78350f"/>

    <circle cx="1500" cy="540" r="110"/>
    <circle cx="1580" cy="480" r="130"/>
    <circle cx="1660" cy="550" r="95"/>
    <rect x="1560" y="560" width="32" height="120" fill="#78350f"/>
  </g>

  <!-- Curving Paved Campus Walking Track -->
  <path d="M 0 950 Q 600 750 960 780 T 1920 900 L 1920 1080 L 0 1080 Z" fill="#e2e8f0" opacity="0.9"/>

  <!-- Plaque -->
  <rect x="560" y="990" width="800" height="56" rx="10" fill="#1b2842" opacity="0.85"/>
  <text x="960" y="1016" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">PRASAD GROUP OF INSTITUTIONS · GREEN CAMPUS GROUNDS</text>
  <text x="960" y="1035" font-family="'DM Sans', sans-serif" font-weight="500" font-size="11" fill="#9db2d4" text-anchor="middle">Lush Campus Lawns &amp; Sports Ground • Replace with pgi_green_campus.jpg</text>
</svg>
