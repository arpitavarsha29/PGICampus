<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ba4d6"/>
      <stop offset="45%" stop-color="#b6cde8"/>
      <stop offset="70%" stop-color="#e8eef6"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d68c45"/>
      <stop offset="25%" stop-color="#e59850"/>
      <stop offset="70%" stop-color="#c97c36"/>
      <stop offset="100%" stop-color="#aa6325"/>
    </linearGradient>
    <linearGradient id="facadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf7f0"/>
      <stop offset="100%" stop-color="#e6dcce"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ea84f"/>
      <stop offset="50%" stop-color="#4a8730"/>
      <stop offset="100%" stop-color="#2d5e1a"/>
    </linearGradient>
    <linearGradient id="pavementGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9dee8"/>
      <stop offset="100%" stop-color="#a8b2c2"/>
    </linearGradient>
    <pattern id="brick" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="#cc823e"/>
      <line x1="0" y1="0" x2="20" y2="0" stroke="#b26d2e" stroke-width="1"/>
      <line x1="0" y1="5" x2="20" y2="5" stroke="#b26d2e" stroke-width="1"/>
      <line x1="10" y1="0" x2="10" y2="5" stroke="#b26d2e" stroke-width="1"/>
      <line x1="0" y1="5" x2="0" y2="10" stroke="#b26d2e" stroke-width="1"/>
      <line x1="20" y1="5" x2="20" y2="10" stroke="#b26d2e" stroke-width="1"/>
    </pattern>
    <pattern id="windowPattern" width="40" height="50" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="28" height="34" rx="4" fill="#39587a" stroke="#ffffff" stroke-width="2"/>
      <line x1="20" y1="8" x2="20" y2="42" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="6" y1="25" x2="34" y2="25" stroke="#ffffff" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <ellipse cx="340" cy="220" rx="180" ry="50" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="440" cy="200" rx="140" ry="60" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="1480" cy="180" rx="220" ry="60" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="1600" cy="160" rx="160" ry="50" fill="#ffffff" opacity="0.55"/>

  <!-- Distant Trees -->
  <path d="M 0 680 Q 200 640 400 680 T 800 670 T 1200 680 T 1600 670 T 1920 680 L 1920 850 L 0 850 Z" fill="#4d784a" opacity="0.7"/>

  <!-- College Main Building Silhouette & Structure -->
  <!-- Left Wing -->
  <rect x="220" y="380" width="560" height="340" fill="url(#bldgGrad)" stroke="#8e4d17" stroke-width="3"/>
  <rect x="230" y="390" width="540" height="320" fill="url(#windowPattern)" opacity="0.85"/>
  <rect x="210" y="360" width="580" height="25" fill="#f8f4ec" stroke="#cfc3af" stroke-width="2"/>

  <!-- Right Wing -->
  <rect x="1140" y="380" width="560" height="340" fill="url(#bldgGrad)" stroke="#8e4d17" stroke-width="3"/>
  <rect x="1150" y="390" width="540" height="320" fill="url(#windowPattern)" opacity="0.85"/>
  <rect x="1130" y="360" width="580" height="25" fill="#f8f4ec" stroke="#cfc3af" stroke-width="2"/>

  <!-- Central Administrative Grand Block -->
  <rect x="740" y="260" width="440" height="460" fill="url(#facadeGrad)" stroke="#b5a794" stroke-width="4"/>
  
  <!-- Central Clock / Emblem Tower Pediment -->
  <polygon points="720,260 960,120 1200,260" fill="#e8ded0" stroke="#a39580" stroke-width="4"/>
  <polygon points="760,250 960,140 1160,250" fill="#d2782b"/>

  <!-- Emblem / Clock Circle -->
  <circle cx="960" cy="205" r="38" fill="#ffffff" stroke="#1f3b73" stroke-width="4"/>
  <text x="960" y="213" font-family="'Manrope', sans-serif" font-weight="900" font-size="20" fill="#1f3b73" text-anchor="middle">PGI</text>

  <!-- PGI Arch Title Band -->
  <rect x="750" y="275" width="420" height="48" fill="#1b3668" rx="6"/>
  <text x="960" y="306" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">PRASAD GROUP OF INSTITUTIONS</text>

  <!-- Columns / Pillars (Portico) -->
  <rect x="790" y="340" width="340" height="380" fill="#f5ede0"/>
  <g fill="#ffffff" stroke="#c2b6a3" stroke-width="3">
    <!-- 6 Grand Classical Pillars -->
    <rect x="800" y="340" width="32" height="380"/>
    <rect x="860" y="340" width="32" height="380"/>
    <rect x="920" y="340" width="32" height="380"/>
    <rect x="970" y="340" width="32" height="380"/>
    <rect x="1030" y="340" width="32" height="380"/>
    <rect x="1090" y="340" width="32" height="380"/>
  </g>
  <!-- Pillar Tops/Capitals -->
  <rect x="780" y="330" width="360" height="18" fill="#dfd4c2" stroke="#a99c89" stroke-width="2"/>

  <!-- Grand Entrance Arch & Glass Doors -->
  <path d="M 910 610 Q 960 550 1010 610 L 1010 720 L 910 720 Z" fill="#203a5e" stroke="#ffffff" stroke-width="3"/>
  <line x1="960" y1="565" x2="960" y2="720" stroke="#ffffff" stroke-width="2"/>

  <!-- Upper Balcony Windows on Central Block -->
  <rect x="800" y="360" width="320" height="160" fill="url(#windowPattern)"/>

  <!-- Wide Entrance Staircase -->
  <polygon points="680,720 1240,720 1320,770 600,770" fill="#ded6c8" stroke="#a89d8c" stroke-width="2"/>
  <polygon points="640,740 1280,740 1340,770 580,770" fill="#cbbfad" stroke="#978c7a" stroke-width="2"/>

  <!-- Pavement / Plaza -->
  <polygon points="0,830 1920,830 1920,1080 0,1080" fill="url(#pavementGrad)"/>
  
  <!-- Campus Gardens & Lawns -->
  <polygon points="0,750 620,750 500,890 0,910" fill="url(#lawnGrad)"/>
  <polygon points="1300,750 1920,750 1920,910 1420,890" fill="url(#lawnGrad)"/>

  <!-- Campus Trees & Shrubbery -->
  <g fill="#336825">
    <circle cx="160" cy="740" r="50"/>
    <circle cx="190" cy="710" r="60"/>
    <circle cx="230" cy="740" r="45"/>
    <rect x="180" y="740" width="18" height="60" fill="#5c3a21"/>

    <circle cx="1690" cy="740" r="50"/>
    <circle cx="1730" cy="710" r="65"/>
    <circle cx="1770" cy="740" r="50"/>
    <rect x="1720" y="740" width="18" height="60" fill="#5c3a21"/>

    <!-- Foreground Ornamental Bushes -->
    <circle cx="580" cy="780" r="28" fill="#528e3b"/>
    <circle cx="630" cy="785" r="24" fill="#43772f"/>
    <circle cx="1290" cy="785" r="24" fill="#43772f"/>
    <circle cx="1340" cy="780" r="28" fill="#528e3b"/>
  </g>

  <!-- Campus Central Pathway Guide -->
  <polygon points="860,770 1060,770 1180,1080 740,1080" fill="#eef2f7" opacity="0.9"/>

  <!-- Notice/Label Watermark for Authenticity Clarity -->
  <rect x="560" y="990" width="800" height="56" rx="10" fill="#1b2842" opacity="0.85"/>
  <text x="960" y="1016" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">PRASAD GROUP OF INSTITUTIONS · JAUNPUR, UTTAR PRADESH</text>
  <text x="960" y="1035" font-family="'DM Sans', sans-serif" font-weight="500" font-size="11" fill="#9db2d4" text-anchor="middle">Main Campus &amp; Administrative Complex • Place authentic photos in /assets/college-photos/</text>
</svg>
