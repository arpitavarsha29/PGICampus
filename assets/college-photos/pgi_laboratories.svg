<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#labBg)"/>

  <!-- Lab Workbenches -->
  <rect x="0" y="660" width="1920" height="420" fill="#334155"/>
  <rect x="0" y="650" width="1920" height="20" fill="#64748b"/>

  <!-- Computer monitors in Computer Science / Engineering Lab -->
  <g>
    <!-- Screen 1 -->
    <rect x="220" y="440" width="240" height="150" rx="8" fill="url(#screenGlow)" stroke="#0f172a" stroke-width="4"/>
    <rect x="320" y="590" width="40" height="60" fill="#0f172a"/>
    <rect x="290" y="640" width="100" height="10" rx="3" fill="#0f172a"/>

    <!-- Screen 2 -->
    <rect x="560" y="440" width="240" height="150" rx="8" fill="url(#screenGlow)" stroke="#0f172a" stroke-width="4"/>
    <rect x="660" y="590" width="40" height="60" fill="#0f172a"/>
    <rect x="630" y="640" width="100" height="10" rx="3" fill="#0f172a"/>

    <!-- Screen 3 -->
    <rect x="900" y="440" width="240" height="150" rx="8" fill="url(#screenGlow)" stroke="#0f172a" stroke-width="4"/>
    <rect x="1000" y="590" width="40" height="60" fill="#0f172a"/>
    <rect x="970" y="640" width="100" height="10" rx="3" fill="#0f172a"/>

    <!-- Screen 4 -->
    <rect x="1240" y="440" width="240" height="150" rx="8" fill="url(#screenGlow)" stroke="#0f172a" stroke-width="4"/>
    <rect x="1340" y="590" width="40" height="60" fill="#0f172a"/>
    <rect x="1310" y="640" width="100" height="10" rx="3" fill="#0f172a"/>
  </g>

  <!-- Network Rack and Lab Apparatus -->
  <rect x="1600" y="240" width="240" height="420" rx="6" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <circle cx="1630" cy="270" r="5" fill="#22c55e"/>
  <circle cx="1650" cy="270" r="5" fill="#3b82f6"/>
  <circle cx="1670" cy="270" r="5" fill="#eab308"/>

  <!-- Plaque -->
  <rect x="560" y="990" width="800" height="56" rx="10" fill="#1b2842" opacity="0.85"/>
  <text x="960" y="1016" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">PRASAD GROUP OF INSTITUTIONS · ADVANCED LABORATORIES</text>
  <text x="960" y="1035" font-family="'DM Sans', sans-serif" font-weight="500" font-size="11" fill="#9db2d4" text-anchor="middle">Engineering &amp; Pharmacy Laboratories • Replace with pgi_laboratories.jpg</text>
</svg>
