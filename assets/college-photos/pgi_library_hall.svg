<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="libSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Library Interior Hall Base -->
  <rect width="1920" height="1080" fill="#2d3748"/>
  <rect x="0" y="700" width="1920" height="380" fill="#1a202c"/>

  <!-- Bookshelves Left -->
  <g fill="#7c4a27">
    <rect x="80" y="160" width="340" height="600"/>
    <g fill="#e2e8f0" opacity="0.8">
      <rect x="100" y="200" width="300" height="15" fill="#4a5568"/>
      <rect x="100" y="220" width="280" height="60" fill="#cbd5e1"/>
      <rect x="100" y="300" width="300" height="15" fill="#4a5568"/>
      <rect x="100" y="320" width="290" height="60" fill="#cbd5e1"/>
      <rect x="100" y="400" width="300" height="15" fill="#4a5568"/>
      <rect x="100" y="420" width="270" height="60" fill="#cbd5e1"/>
      <rect x="100" y="500" width="300" height="15" fill="#4a5568"/>
      <rect x="100" y="520" width="285" height="60" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Bookshelves Right -->
  <g fill="#7c4a27">
    <rect x="1500" y="160" width="340" height="600"/>
    <g fill="#e2e8f0" opacity="0.8">
      <rect x="1520" y="200" width="300" height="15" fill="#4a5568"/>
      <rect x="1520" y="220" width="280" height="60" fill="#cbd5e1"/>
      <rect x="1520" y="300" width="300" height="15" fill="#4a5568"/>
      <rect x="1520" y="320" width="290" height="60" fill="#cbd5e1"/>
      <rect x="1520" y="400" width="300" height="15" fill="#4a5568"/>
      <rect x="1520" y="420" width="270" height="60" fill="#cbd5e1"/>
      <rect x="1520" y="500" width="300" height="15" fill="#4a5568"/>
      <rect x="1520" y="520" width="285" height="60" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- Grand Central Library Window Arch -->
  <path d="M 600 700 L 600 350 Q 960 140 1320 350 L 1320 700 Z" fill="#475569" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 640 680 L 640 370 Q 960 180 1280 370 L 1280 680 Z" fill="#93c5fd" opacity="0.6"/>

  <!-- Study Reading Desks -->
  <rect x="660" y="650" width="600" height="90" rx="6" fill="#854d0e" stroke="#ca8a04" stroke-width="2"/>
  <rect x="700" y="620" width="520" height="30" fill="#a16207"/>
  <!-- Green Banker Study Lamps -->
  <rect x="760" y="590" width="40" height="20" rx="6" fill="#15803d"/>
  <line x1="780" y1="610" x2="780" y2="630" stroke="#ca8a04" stroke-width="4"/>
  <rect x="1120" y="590" width="40" height="20" rx="6" fill="#15803d"/>
  <line x1="1140" y1="610" x2="1140" y2="630" stroke="#ca8a04" stroke-width="4"/>

  <!-- Warm Light Glow -->
  <polygon points="600,0 1320,0 1520,700 400,700" fill="url(#warmLight)"/>

  <!-- Plaque -->
  <rect x="560" y="990" width="800" height="56" rx="10" fill="#1b2842" opacity="0.85"/>
  <text x="960" y="1016" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">PRASAD GROUP OF INSTITUTIONS · CENTRAL LIBRARY</text>
  <text x="960" y="1035" font-family="'DM Sans', sans-serif" font-weight="500" font-size="11" fill="#9db2d4" text-anchor="middle">Knowledge Resource Centre • Replace with pgi_library_hall.jpg</text>
</svg>
